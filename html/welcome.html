<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Restaurant App</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <div class="app-container welcome-screen">

        <header class="top-header">
            <div class="service-action">
                <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications">
                    <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </a>
            </div>
            <div class="language-picker">
                <select onchange="changeLanguage(this.value)">
                    <option value="en">EN</option>
                    <option value="sv">SV</option>
                    <option value="fr">FR</option>
                </select>
            </div>
        </header>

        <main class="welcome-content">                
            <h1 class="restaurant-name" data-i18n="restaurant_name">Five Pots and One Caulderon</h1>
            <p class="welcome-text" data-i18n="welcome_text">Scan, order, and enjoy right at your table.</p>
                
            <a href="menu.html" class="start-btn" data-i18n="view_menu">View Menu</a>
        </main>

    </div>
    <script src="../js/data/dictionary.js"></script>
    <script src="../js/data/menuData.js"></script>

    <script src="../js/order_page.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
    <script src="../js/controller/MenuController.js"></script>
</body>
</html>
