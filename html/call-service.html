<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Service</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- 
      Call Service Page 
      Allows the user to request assistance from the restaurant staff. 
      Provides a button that triggers a confirmation popup.
    -->
    <div class="app-container">
        <header class="top-header">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back" data-i18n-aria-label="back">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div class="header-actions">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="main-content center-layout">
            
            <h1 class="restaurant-name mb-lg" data-i18n="need_help">Need Help?</h1>
            
            <button id="callServiceBtn" class="start-btn" data-i18n="call_service">Call Service</button>

            <div id="servicePopup" class="popup hidden">
                <p data-i18n="service_called">Service has been called! Staff is on the way.</p>
            </div>
        </main>
    </div>

    <script src="../js/data/dictionary.js"></script>
    <script src="../js/utils/AppUtils.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
    <script src="../js/controller/ServiceController.js"></script>
</body>
</html>
