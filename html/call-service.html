<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Service</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- 
      Call Service Page 
      Allows the user to request assistance from the restaurant staff. 
      Provides a button that triggers a confirmation popup.
    -->
    <div class="app-container">
        <header class="top-header" style="justify-content: space-between; align-items: center; padding: 16px 24px;">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back" style="display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="main-content" style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; padding: 20px;">
            
            <h1 class="restaurant-name" style="margin-bottom: 40px;" data-i18n="need_help">Need Help?</h1>
            
            <button id="callServiceBtn" class="start-btn" data-i18n="call_service">Call Service</button>

            <div id="servicePopup" class="popup hidden">
                <p data-i18n="service_called">Service has been called! Staff is on the way.</p>
            </div>
        </main>
    </div>

    <script>
        /**
         * call-service inline script
         * Handles the button click to display a service confirmation popup.
         */
        const btn = document.getElementById('callServiceBtn');
        const popup = document.getElementById('servicePopup');

        btn.addEventListener('click', () => {
            // Show the popup
            popup.classList.remove('hidden');
            
            // Disable the button and change its translation key
            btn.disabled = true;
            btn.setAttribute('data-i18n', 'service_called_btn');
            btn.classList.add('disabled-btn');
            
            // Re-run the translation function so the new key is translated
            if (typeof updateUI === 'function') {
                updateUI();
            }
        });
    </script>
    <script src="../js/data/dictionary.js"></script>
    <script src="../js/data/menuData.js"></script>

    <script src="../js/order_page.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
    <script src="../js/controller/MenuController.js"></script>
</body>
</html>
