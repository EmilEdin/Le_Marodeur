<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiter Payment - Le Marodeur</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- 
      Wait for Waiter Payment Page 
      Notifies the user that a waiter has been contacted and will 
      take their payment at the table.
    -->
    <div class="app-container">
        <header class="top-header">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div class="header-actions">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="#b58c67" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </a>            
                </div>
            </div>
        </header>

        <main class="main-content center-layout center-text">
                        
            <h1 class="restaurant-name mb-sm" data-i18n="order_sent">Order Sent!</h1>
            
            <p class="status-text" data-i18n="waiter_notified">
                Your order has been placed. A waiter has been notified and will be with you shortly to process your payment and bring your food.
            </p>
            
            <a href="../index.html" class="start-btn" data-i18n="return_home">Return to Home</a>
            
        </main>
    </div>

    <script src="../js/data/dictionary.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
</body>
</html>
