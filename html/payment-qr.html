<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Payment - Le Marodeur</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        .mock-qr-box {
            width: 200px;
            height: 200px;
            background-color: #fff;
            border: 2px dashed #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .mock-camera {
            width: 250px;
            height: 250px;
            background-color: #000;
            border: 4px solid #8c1819;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border-radius: 12px;
            margin-bottom: 20px;
            position: relative;
        }
        .mock-camera::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- 
      QR Payment Page 
      Mockup page that simulates showing a QR code to pay or scanning a QR code.
    -->
    <div class="app-container">
        <header class="top-header" style="justify-content: space-between; align-items: center; padding: 16px 24px;">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back" style="display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications" style="display: flex; align-items: center; justify-content: center; position: relative;">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="#b58c67" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true" style="width: 26px; height: 26px;">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span style="position: absolute; top: 0px; right: 2px; width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; border: 2px solid #1a3d3b;"></span>
                    </a>            
                </div>
            </div>
        </header>

        <main class="main-content" style="padding: 20px; text-align: center;">
            <h1 class="restaurant-name" style="margin-bottom: 10px;" data-i18n="pay_by_qr">Pay by QR Code</h1>
            
            <div id="qr-options" style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px;">
                <button class="start-btn" onclick="showSection('show-qr-section')" data-i18n="show_qr_code">Show QR Code</button>
                <button class="start-btn" style="background-color: #333;" onclick="showSection('scan-qr-section')" data-i18n="scan_qr_code">Scan a QR Code</button>
            </div>

            <div id="show-qr-section" class="qr-section hidden">
                <p data-i18n="scan_with_phone">Scan this code with your mobile banking app</p>
                <div class="mock-qr-box">📱</div>
                <button class="icon-btn" onclick="showSection('qr-options')" style="margin-top: 10px;">Back</button>
            </div>

            <div id="scan-qr-section" class="qr-section hidden">
                <p data-i18n="hold_qr_to_camera">Hold your physical QR code up to the camera</p>
                <div class="mock-camera">Camera View</div>
                <button class="icon-btn" onclick="showSection('qr-options')" style="margin-top: 10px;">Back</button>
            </div>
        </main>
    </div>

    <script>
        /**
         * Toggles the visibility of the QR payment sections.
         * @param {string} sectionId - The ID of the section to show.
         */
        function showSection(sectionId) {
            document.getElementById('qr-options').classList.add('hidden');
            document.getElementById('show-qr-section').classList.add('hidden');
            document.getElementById('scan-qr-section').classList.add('hidden');
            
            document.getElementById(sectionId).classList.remove('hidden');
        }
    </script>
    <script src="../js/data/dictionary.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
</body>
</html>
