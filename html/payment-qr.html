<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Payment - Le Marodeur</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- 
      QR Payment Page 
      Mockup page that simulates showing a QR code to pay or scanning a QR code.
    -->
    <div class="app-container">
        <header class="top-header">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div class="header-actions">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="#b58c67" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </a>            
                </div>
            </div>
        </header>

        <main class="main-content layout-padded center-text">
            <h1 class="restaurant-name mb-xs" data-i18n="pay_by_qr">Pay by QR Code</h1>
            
            <div id="qr-options" class="qr-options-flex">
                <button class="start-btn" onclick="showSection('show-qr-section')" data-i18n="show_qr_code">Show QR Code</button>
                <button class="start-btn btn-secondary" onclick="showSection('scan-qr-section')" data-i18n="scan_qr_code">Scan a QR Code</button>
            </div>

            <div id="show-qr-section" class="qr-section hidden">
                <p data-i18n="scan_with_phone">Scan this code with your mobile banking app</p>
                <div class="mock-qr-box">
                <img src="../assets/images/qr-code.jpg" alt="QR code for payment" class="qr-image">
                </div>
                <button class="payment-back-btn icon-btn mt-sm" onclick="showSection('qr-options')">Back</button>
            </div>

            <div id="scan-qr-section" class="qr-section hidden">
                <p data-i18n="hold_qr_to_camera">Hold your physical QR code up to the camera</p>
                <div class="mock-camera">Camera View</div>
                <button class="payment-back-btn icon-btn mt-sm" onclick="showSection('qr-options')">Back</button>
            </div>
        </main>
    </div>

    <script>
        /**
         * Toggles the visibility of the QR payment sections.
         * @param {string} sectionId - The ID of the section to show.
         */
        function showSection(sectionId) {
            document.getElementById('qr-options').classList.add('hidden');
            document.getElementById('show-qr-section').classList.add('hidden');
            document.getElementById('scan-qr-section').classList.add('hidden');
            
            document.getElementById(sectionId).classList.remove('hidden');
        }
    </script>
    <script src="../js/data/dictionary.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
</body>
</html>
