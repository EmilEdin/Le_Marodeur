<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/styles.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Ordering App</title>
</head>
<body>

    <div class="app-container">

        <header class="top-header">
            <div class="service-action">
                <a href="call-service.html" class="icon-btn bell-icon" style="text-decoration: none;">🔔</a>
            </div>
            <div class="language-picker">
                <select onchange="changeLanguage(this.value)">
                    <option value="en">EN</option>
                    <option value="sv">SV</option>
                    <option value="es">ES</option>
                </select>
            </div>
        </header>

        <main class="main-content">
            <nav class="category-slider" aria-label="Menu Categories">
                <ul class="category-list">
                    <li class="category-item active">
                        <button type="button" class="category-btn" aria-current="true">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name" data-i18n="category_meal_1">Limited Deluxe</span>
                        </button>
                    </li>
                    
                    <li class="category-item">
                        <button type="button" class="category-btn">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name" data-i18n="category_meal_2">Måltider</span>
                        </button>
                    </li>
                    
                    <li class="category-item">
                        <button type="button" class="category-btn">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name" data-i18n="category_meal_3">Impossible</span>
                        </button>
                    </li>
                    
                    <li class="category-item">
                        <button type="button" class="category-btn">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name" data-i18n="category_meal_4">Supreme Green</span>
                        </button>
                    </li>

                    <li class="category-item">
                        <button type="button" class="category-btn">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name">Kyckling</span>
                        </button>
                    </li>
                </ul>
            </nav>

            <section class="menu-list" aria-label="Available Meals">
                <article class="meal-card" data-meal-id="bolognese">
                    <h2 class="meal-name" data-i18n="meal_1_name">Bolognese</h2> 
                </article>
                
                <article class="meal-card">
                    <h2 class="meal-name" data-i18n="meal_2_name">Meal</h2>
                </article>
                
                <article class="meal-card">
                    <h2 class="meal-name" data-i18n="meal_3_name">Meal</h2>
                </article>
                
                <article class="meal-card">
                    <h2 class="meal-name" data-i18n="meal_4_name">Meal</h2>
                </article>
            </section>
        </main>

        <footer class="bottom-cart-bar">
            <div class="cart-status">
                <p data-i18n="cart_empty">You have not added anything yet</p>
            </div>
            <button class="icon-btn cart-icon" aria-label="View shopping cart">🛒</button>
        </footer>

        <dialog id="meal-detail-modal" class="meal-modal">
            <div class="modal-content">

                <div id="modal-header" class="modal-header">
                    <button class="info-icon" aria-label="Visa allergener">ⓘ</button>
                    <button method="dialog" class="close-btn">X</button>
                </div>

                
                
                <h2 id="modal-title" data-i18n="modal_title">The name of the food</h2>
                
                <div class="order-controls">
                    <div class="quantity-selector">
                        <span>✎</span>
                        <select id="meal-quantity">
                            <option value="1">1</option>
                            <option value="2">2</option>
                        </select>
                    </div>

                    <button class="add-btn" id="add-to-order">
                        <span>+</span>
                        <span id="modal-price">93:-</span>
                    </button>
                </div>
            </div>
        </dialog>
    </div>

    <!-- Drag and Drop Functionality -->
    <script src="../js/order_page.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
</body>
<script src="../js/controller/MenuController.js"></script>
</html>
