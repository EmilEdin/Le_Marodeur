<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Le Marodeur</title>
</head>
<body>
    <!-- 
      Menu Page 
      Displays the categories and meals for the restaurant. Includes a horizontal
      scrollable category list, a meal list, and a modal for meal details.
    -->
    <div class="app-container">

        <header class="top-header">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back" data-i18n-aria-label="back">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div class="header-actions">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications" data-i18n-aria-label="notifications">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="#b58c67" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-dot"></span>
                    </a>            
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="order-mode-panel" aria-label="Order mode">
                <p class="order-mode-label" data-i18n="order_mode">Order Mode</p>
                <div class="order-mode-toggle">
                    <button type="button" class="order-mode-btn active" data-order-mode="single" data-i18n="single_order">Single Order</button>
                    <button type="button" class="order-mode-btn" data-order-mode="group" data-i18n="group_order">Group Order</button>
                </div>
                <div id="guest-selection-controls" class="guest-selection-controls hidden">
                    <label for="active-guest-select" class="guest-selection-label" data-i18n="guest_label">Guest</label>
                    <div class="quantity-selector guest-selector">
                        <select id="active-guest-select" aria-label="Guest"></select>
                        <svg viewBox="0 0 24 24" fill="none" stroke="#102b2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
            </section>

            <nav class="category-slider" aria-label="Menu Categories">
                <ul class="category-list" id="category-list"></ul>
            </nav>

            <section class="menu-list" id="menu-list" aria-label="Available Meals"></section>
        </main>

        <footer class="bottom-cart-bar clickable-footer" onclick="window.location.href='order.html'">
            <div class="cart-status">
                <p data-i18n="cart_empty">You have not added anything yet</p>
            </div>
            <div class="cart-icon-wrapper">
                <div class="icon-btn cart-icon" aria-label="Shopping Cart" data-i18n-aria-label="shopping_cart">
                    <svg class="cart-svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </div>                
                <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
            </div>
        </footer>

        <dialog id="meal-detail-modal" class="meal-modal">
            <div class="modal-content">

                <div id="modal-header" class="modal-header">
                    <button class="info-icon" aria-label="Dietary information" data-i18n-aria-label="allergen_info">
                    <svg class="info-svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    </button>     

                    <button id="close-meal-btn" class="close-btn" aria-label="Close" data-i18n-aria-label="close">
                        <svg class="x-svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                
                <h2 id="modal-title">The name of the food</h2>
                
                <div class="order-controls">
                    <div class="modal-price-row">
                        <span class="modal-price-label" data-i18n="total_to_pay">Total to Pay:</span>
                        <span id="modal-price" class="modal-price-amount">93:-</span>
                    </div>

                    <div class="modal-controls-row">
                        <div class="quantity-selector">
                            <select id="meal-quantity">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                            <svg viewBox="0 0 24 24" fill="none" stroke="#102b2a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>

                        <button class="add-btn" id="add-to-order">
                            <span data-i18n="add_to_order" style="font-weight: 600; font-size: 18px;">Add</span>
                        </button>
                    </div>
                </div>
            </div>
        </dialog>

        <dialog id="info-modal" class="meal-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 data-i18n="info_title">Dietary Information</h2>
                    <button class="close-info-btn close-btn" aria-label="Close" data-i18n-aria-label="close">X</button>
                </div>

                <div class="info-body">
                    <p class="meal-description">Meal description</p>

                    <h3 data-i18n="dietary_tags_title" class="dietary-title">Dietary & Allergens</h3>
                    <div class="dietary-tags"></div>
                </div>
            </div>
        </dialog>
    </div>
    <script src="../js/data/dictionary.js"></script>
    <script src="../js/utils/AppUtils.js"></script>
    <script src="../js/data/menuData.js"></script>
    <script src="../js/model/CartModel.js"></script>

    <script src="../js/view/MenuView.js"></script>
    <script src="../js/order_page.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
    <script src="../js/controller/MenuController.js"></script>
</body>
</html>
