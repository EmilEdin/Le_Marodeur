<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Payment - Le Marodeur</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .payment-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .form-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        .row-group {
            display: flex;
            gap: 15px;
        }
    </style>
</head>
<body>
    <!-- 
      Card Payment Page 
      Provides a form for users to enter their credit/debit card details 
      to pay for their order.
    -->
    <div class="app-container">
        <header class="top-header">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div class="header-actions">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="#b58c67" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </a>            
                </div>
            </div>
        </header>

        <main class="main-content layout-padded center-text">
            <h1 class="restaurant-name mb-md" data-i18n="pay_by_card">Pay by Card</h1>
            
            <form class="payment-form" onsubmit="event.preventDefault(); alert('Payment processing (MVP mock)');">
                <div class="form-group">
                    <label data-i18n="card_name">Name on Card</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label data-i18n="card_number">Card Number</label>
                    <input type="text" placeholder="**** **** **** ****" required>
                </div>
                <div class="row-group">
                    <div class="form-group flex-1">
                        <label data-i18n="card_expiry">Expiry Date</label>
                        <input type="text" placeholder="MM/YY" required>
                    </div>
                    <div class="form-group flex-1">
                        <label data-i18n="card_cvc">CVC</label>
                        <input type="text" placeholder="123" required>
                    </div>
                </div>
                
                <button type="submit" class="start-btn btn-full" data-i18n="pay_now">Pay Now</button>
            </form>
        </main>
    </div>

    <script src="../js/data/dictionary.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
</body>
</html>
