<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Order - Table Ordering App</title>
</head>
<body>
    <!-- 
      Order Page 
      Displays the user's current cart items. Allows for removing items 
      and provides a path to the checkout page.
    -->
    <div class="app-container">

        <header class="top-header" style="justify-content: space-between; align-items: center;">
            <a href="javascript:history.back()" class="icon-btn" style="text-decoration: none; font-size: 24px;">❮</a>
            
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </a>            
                </div>
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)">
                        <option value="en">EN</option>
                        <option value="sv">SV</option>
                        <option value="fr">FR</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="order-header-container">
                <h1 class="order-header" data-i18n="my_order">MY ORDER</h1>
                <button class="checkout-header-btn" onclick="window.location.href='checkout.html';">Checkout</button>
            </div>
            
            <div class="cart-table-wrapper">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th data-i18n="dish_name">Dish Name</th>
                            <th data-i18n="price_per_item">Price/Item</th>
                            <th data-i18n="total_items">Qty</th>
                            <th data-i18n="total_price">Total Price</th>
                            <th class="action-cell"></th>
                        </tr>
                    </thead>
                    <tbody id="order-container">
                    </tbody>
                </table>
            </div>
        </main>

        <footer class="bottom-cart-bar clickable-footer" onclick="window.location.href='checkout.html';">
            <div class="cart-status">
                <p id="order-total-text">To Payment 0€</p>
            </div>
            <div class="cart-icon-wrapper">
                <div class="icon-btn cart-icon" aria-label="Shopping Cart">
                    <svg class="cart-svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                </div>                
                <span id="cart-badge" class="cart-badge" style="display:none;">0</span>
            </div>
        </footer>

        <dialog id="delete-confirm-modal" class="meal-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 data-i18n="delete_confirm_title" class="delete-confirm-title">Remove Item?</h2>
                </div>
                <p data-i18n="delete_confirm_text" class="delete-confirm-text">
                    Are you sure you want to remove this item from your order?
                </p>
                <div class="order-controls center-gap">
                    <button id="cancel-delete-btn" class="quantity-selector cancel-btn" data-i18n="cancel_btn">Cancel</button>
                    <button id="confirm-delete-btn" class="add-btn remove-btn" data-i18n="remove_btn">Remove</button>
                </div>
            </div>
        </dialog>

    </div>

    <script src="../js/data/dictionary.js"></script>
    <script src="../js/data/menuData.js"></script>
    <script src="../js/model/CartModel.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
    <script src="../js/controller/OrderController.js"></script>
</body>
</html>
