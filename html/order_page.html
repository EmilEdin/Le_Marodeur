<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Ordering App</title>
</head>
<body>

    <div class="app-container">

        <header class="top-header">
            <div class="service-action">
                <span class="action-text">1. Call for service</span>
                <button class="icon-btn bell-icon" aria-label="Call for service">🔔</button>
            </div>
        </header>

        <main class="main-content">
            <nav class="category-slider" aria-label="Menu Categories">
                <ul class="category-list">
                    <li class="category-item active">
                        <button type="button" class="category-btn" aria-current="true">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name">Limited Deluxe</span>
                        </button>
                    </li>
                    
                    <li class="category-item">
                        <button type="button" class="category-btn">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name">Måltider</span>
                        </button>
                    </li>
                    
                    <li class="category-item">
                        <button type="button" class="category-btn">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name">Impossible</span>
                        </button>
                    </li>
                    
                    <li class="category-item">
                        <button type="button" class="category-btn">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name">Supreme Green</span>
                        </button>
                    </li>

                    <li class="category-item">
                        <button type="button" class="category-btn">
                            <img src="placeholder.jpg" alt="" class="category-img">
                            <span class="category-name">Kyckling</span>
                        </button>
                    </li>
                </ul>
            </nav>

            <section class="menu-list" aria-label="Available Meals">
                <article class="meal-card">
                    <h2 class="meal-name">Meal</h2> 
                </article>
                
                <article class="meal-card">
                    <h2 class="meal-name">Meal</h2>
                </article>
                
                <article class="meal-card">
                    <h2 class="meal-name">Meal</h2>
                </article>
                
                <article class="meal-card">
                    <h2 class="meal-name">Meal</h2>
                </article>
            </section>
        </main>

        <footer class="bottom-cart-bar">
            <div class="cart-status">
                <p>You have not added anything yet</p>
            </div>
            <button class="icon-btn cart-icon" aria-label="View shopping cart">🛒</button>
        </footer>

    </div>

    <!-- Drag and Drop Functionality -->
    <script src="../js/order_page.js"></script>
</body>
</html>
