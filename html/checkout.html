<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Le Marodeur</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .checkout-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 20px;
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        .table-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }
        .table-input-group label {
            font-size: 16px;
            font-weight: 600;
            color: #84a1a0;
        }
        .table-input-group input {
            padding: 16px;
            font-size: 18px;
            background-color: #102b2a;
            color: #ffffff;
            border: 2px solid #0b1e1d;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .table-input-group input:focus {
            border-color: #b58c67;
        }
        .table-input-group input::placeholder {
            color: rgba(132, 161, 160, 0.4);
        }
        
        .checkout-pay-btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .checkout-pay-btn:active {
            transform: scale(0.98);
        }
        .primary-pay-btn {
            background-color: #b58c67;
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(181, 140, 103, 0.3);
        }
        .primary-pay-btn:hover {
            background-color: #9a7554;
        }
        .secondary-pay-btn {
            background-color: transparent;
            color: #b58c67;
            border: 2px solid #b58c67;
        }
        .secondary-pay-btn:hover {
            background-color: rgba(181, 140, 103, 0.1);
        }
        
        /* New Tipping Styles */
        .tip-section {
            background: #102b2a;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(132, 161, 160, 0.1);
        }
        .tip-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        .tip-btn {
            padding: 12px 10px;
            border: 2px solid #1a3d3b;
            background: transparent;
            color: #84a1a0;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }
        .tip-btn:hover {
            border-color: #84a1a0;
            color: #ffffff;
        }
        .tip-btn.active {
            background: #b58c67;
            color: #ffffff;
            border-color: #b58c67;
            box-shadow: 0 4px 10px rgba(181, 140, 103, 0.3);
        }
    </style>
</head>
<body>
    <!-- 
      Checkout Page 
      Allows the user to input their table number, select a tip amount, 
      view the total cost, and select a payment method.
    -->
    <div class="app-container">
        <header class="top-header" style="justify-content: space-between;">
            <a href="javascript:history.back()" class="icon-btn" style="text-decoration: none; font-size: 24px;">❮</a>
            <div style="display: flex; gap: 15px; align-items: center;">
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" style="text-decoration: none;">🔔</a>
                </div>
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)">
                        <option value="en">EN</option>
                        <option value="sv">SV</option>
                        <option value="fr">FR</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="checkout-container">
                <h1 class="order-header" data-i18n="checkout_title" style="margin-bottom: 8px; color: #ffffff;">Checkout</h1>
                
                <div class="table-input-group">
                    <label for="table-number" data-i18n="table_number">Table Number:</label>
                    <input type="number" id="table-number" placeholder="12" required>
                </div>

                <div class="tip-section">
                    <p style="font-size: 16px; color: #84a1a0;">
                        <span data-i18n="subtotal">Subtotal:</span> 
                        <span id="subtotal-amount" style="font-weight: bold; color: #ffffff;">0</span><span style="color: #ffffff;">€</span>
                    </p>
                    
                    <p style="margin-top: 20px; font-weight: 600; color: #ffffff;" data-i18n="add_tip">Add a tip:</p>
                    <div class="tip-buttons">
                        <button class="tip-btn active" onclick="applyTip(0, this)">0%</button>
                        <button class="tip-btn" onclick="applyTip(10, this)">10%</button>
                        <button class="tip-btn" onclick="applyTip(15, this)">15%</button>
                        <button class="tip-btn" onclick="applyTip(20, this)">20%</button>
                    </div>

                    <p style="font-size: 20px; font-weight: bold; color: #b58c67; margin-top: 20px; border-top: 1px solid rgba(132,161,160,0.2); padding-top: 15px;">
                        <span data-i18n="total_to_pay">Total to Pay:</span> 
                        <span id="total-amount">0</span>€
                    </p>
                </div>

                <div class="payment-options">
                    <button class="checkout-pay-btn primary-pay-btn" onclick="proceedTo('payment-qr.html')" data-i18n="pay_by_qr">Pay by QR Code</button>
                    <button class="checkout-pay-btn primary-pay-btn" onclick="proceedTo('payment-card.html')" data-i18n="pay_by_card">Pay by Card</button>
                    <button class="checkout-pay-btn secondary-pay-btn" onclick="proceedTo('payment-waiter.html')" data-i18n="pay_at_table">Pay at Table</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/model/CartModel.js"></script>
    <script>
        /**
         * Checkout inline script
         * Handles tip selection, total cost calculation, and payment method navigation.
         */
        let currentTip = 0;

        /**
         * Updates the subtotal and total UI elements based on the cart and selected tip.
         */
        function updateTotals() {
            // Get the total cost from the cart
            const subtotal = CartModel.getTotal();
            const tipAmount = subtotal * (currentTip / 100);
            const total = subtotal + tipAmount;
            
            // Update the UI
            document.getElementById('subtotal-amount').innerText = subtotal.toFixed(2);
            document.getElementById('total-amount').innerText = total.toFixed(2);
        }

        /**
         * Applies the selected tip percentage and highlights the active button.
         * @param {number} percentage - The tip percentage (e.g. 10, 15, 20).
         * @param {HTMLElement} buttonElement - The button element that was clicked.
         */
        function applyTip(percentage, buttonElement) {
            currentTip = percentage;
            
            // Highlight the selected button
            document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            
            updateTotals();
        }

        /**
         * Validates the table number and navigates to the selected payment method.
         * @param {string} url - The URL of the payment page to redirect to.
         */
        function proceedTo(url) {
            const tableNum = document.getElementById('table-number').value;
            if(!tableNum) {
                alert('Please enter your table number to proceed.');
                return;
            }
            localStorage.setItem('le_marodeur_table_number', tableNum);
            window.location.href = url;
        }

        document.addEventListener('DOMContentLoaded', updateTotals);
    </script>
    <script src="../js/data/dictionary.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
</body>
</html>
