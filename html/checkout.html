<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Le Marodeur</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .checkout-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding: 20px;
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }
        .table-input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }
        .table-input-group label {
            font-size: 16px;
            font-weight: 600;
            color: #84a1a0;
        }
        .table-input-group input {
            padding: 16px;
            font-size: 18px;
            background-color: #102b2a;
            color: #ffffff;
            border: 2px solid #0b1e1d;
            border-radius: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .table-input-group input:focus {
            border-color: #b58c67;
        }
        .table-input-group input::placeholder {
            color: rgba(132, 161, 160, 0.4);
        }
        
        .checkout-pay-btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            margin-bottom: 12px;
            font-family: inherit;
        }
        .checkout-pay-btn:active {
            transform: scale(0.98);
        }
        .checkout-pay-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            box-shadow: none;
        }
        .primary-pay-btn {
            background-color: #b58c67;
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(181, 140, 103, 0.3);
        }
        .primary-pay-btn:hover {
            background-color: #9a7554;
        }
        .secondary-pay-btn {
            background-color: transparent;
            color: #b58c67;
            border: 2px solid #b58c67;
        }
        .secondary-pay-btn:hover {
            background-color: rgba(181, 140, 103, 0.1);
        }
        
        /* New Tipping Styles */
        .tip-section {
            background: #102b2a;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(132, 161, 160, 0.1);
        }
        .tip-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 20px 0;
        }
        .tip-btn {
            padding: 12px 10px;
            border: 2px solid #1a3d3b;
            background: transparent;
            color: #84a1a0;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }
        .tip-btn:hover {
            border-color: #84a1a0;
            color: #ffffff;
        }
        .tip-btn.active {
            background: #b58c67;
            color: #ffffff;
            border-color: #b58c67;
            box-shadow: 0 4px 10px rgba(181, 140, 103, 0.3);
        }
    </style>
</head>
<body>
    <!-- 
      Checkout Page 
      Allows the user to input their table number, select a tip amount, 
      view the total cost, and select a payment method.
    -->
    <div class="app-container">
        <header class="top-header">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back" data-i18n-aria-label="back">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div class="header-actions">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications" data-i18n-aria-label="notifications">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="#b58c67" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notification-dot"></span>
                    </a>            
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="checkout-container">
                <h1 class="order-header checkout-heading" data-i18n="checkout_title">Checkout</h1>
                
                <div class="table-input-group">
                    <label for="table-number" data-i18n="table_number">Table Number:</label>
                    <input type="number" id="table-number" placeholder="12" required>
                </div>

                <div class="tip-section">
                    <p class="checkout-subtitle">
                        <span data-i18n="subtotal">Subtotal:</span> 
                        <span id="subtotal-amount" class="text-bold-white">€0</span>
                    </p>
                    
                    <p class="tip-heading" data-i18n="add_tip">Add a tip:</p>
                    <div class="tip-buttons">
                        <button class="tip-btn active" type="button" data-tip-percentage="0">0%</button>
                        <button class="tip-btn" type="button" data-tip-percentage="10">10%</button>
                        <button class="tip-btn" type="button" data-tip-percentage="15">15%</button>
                        <button class="tip-btn" type="button" data-tip-percentage="20">20%</button>
                    </div>

                    <p class="total-price-row">
                        <span data-i18n="total_to_pay">Total to Pay:</span> 
                        <span id="total-amount">€0</span>
                    </p>
                </div>

                <div class="payment-options">
                    <button class="checkout-pay-btn primary-pay-btn" type="button" data-payment-target="payment-qr.html" data-i18n="pay_by_qr">Pay by QR Code</button>
                    <button class="checkout-pay-btn primary-pay-btn" type="button" data-payment-target="payment-card.html" data-i18n="pay_by_card">Pay by Card</button>
                    <button class="checkout-pay-btn secondary-pay-btn" type="button" data-payment-target="payment-waiter.html" data-i18n="pay_at_table">Pay at Table</button>
                </div>

                <p id="checkout-empty-state" class="checkout-helper-text hidden" data-i18n="checkout_empty_hint">
                    Add something to your order before choosing a payment method.
                </p>
            </div>
        </main>
    </div>

    <script src="../js/data/dictionary.js"></script>
    <script src="../js/utils/AppUtils.js"></script>
    <script src="../js/model/CartModel.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
    <script src="../js/controller/CheckoutController.js"></script>
</body>
</html>
