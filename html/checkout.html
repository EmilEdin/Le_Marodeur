<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Le Marodeur</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- 
      Checkout Page 
      Allows the user to input their table number, select a tip amount, 
      view the total cost, and select a payment method.
    -->
    <div class="app-container">
        <header class="top-header">
            <a href="javascript:history.back()" class="icon-btn back-btn" aria-label="Back">
                <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="#b58c67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </a>
            
            <div class="header-actions">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
                <div class="service-action">
                    <a href="call-service.html" class="icon-btn bell-icon" aria-label="Notifications">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="#b58c67" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </a>            
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="checkout-container">
                <h1 class="order-header checkout-heading" data-i18n="checkout_title">Checkout</h1>
                
                <div class="table-input-group">
                    <label for="table-number" data-i18n="table_number">Table Number:</label>
                    <input type="number" id="table-number" placeholder="12" required>
                </div>

                <div class="tip-section">
                    <p class="checkout-subtitle">
                        <span data-i18n="subtotal">Subtotal:</span> 
                        <span id="subtotal-amount" class="text-bold-white">0</span><span class="text-white">€</span>
                    </p>
                    
                    <p class="tip-heading" data-i18n="add_tip">Add a tip:</p>
                    <div class="tip-buttons">
                        <button class="tip-btn active" onclick="applyTip(0, this)">0%</button>
                        <button class="tip-btn" onclick="applyTip(10, this)">10%</button>
                        <button class="tip-btn" onclick="applyTip(15, this)">15%</button>
                        <button class="tip-btn" onclick="applyTip(20, this)">20%</button>
                    </div>

                    <p class="total-price-row">
                        <span data-i18n="total_to_pay">Total to Pay:</span> 
                        <span id="total-amount">0</span>€
                    </p>
                </div>

                <div class="payment-options">
                    <button class="checkout-pay-btn primary-pay-btn" onclick="proceedTo('payment-qr.html')" data-i18n="pay_by_qr">Pay by QR Code</button>
                    <button class="checkout-pay-btn primary-pay-btn" onclick="proceedTo('payment-card.html')" data-i18n="pay_by_card">Pay by Card</button>
                    <button class="checkout-pay-btn secondary-pay-btn" onclick="proceedTo('payment-waiter.html')" data-i18n="pay_at_table">Pay at Table</button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/model/CartModel.js"></script>
    <script>
        /**
         * Checkout inline script
         * Handles tip selection, total cost calculation, and payment method navigation.
         */
        let currentTip = 0;

        /**
         * Updates the subtotal and total UI elements based on the cart and selected tip.
         */
        function updateTotals() {
            // Get the total cost from the cart
            const subtotal = CartModel.getTotal();
            const tipAmount = subtotal * (currentTip / 100);
            const total = subtotal + tipAmount;
            
            // Update the UI
            document.getElementById('subtotal-amount').innerText = subtotal.toFixed(2);
            document.getElementById('total-amount').innerText = total.toFixed(2);
        }

        /**
         * Applies the selected tip percentage and highlights the active button.
         * @param {number} percentage - The tip percentage (e.g. 10, 15, 20).
         * @param {HTMLElement} buttonElement - The button element that was clicked.
         */
        function applyTip(percentage, buttonElement) {
            currentTip = percentage;
            
            // Highlight the selected button
            document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
            
            updateTotals();
        }

        /**
         * Validates the table number and navigates to the selected payment method.
         * @param {string} url - The URL of the payment page to redirect to.
         */
        function proceedTo(url) {
            const tableNum = document.getElementById('table-number').value;
            if(!tableNum) {
                alert('Please enter your table number to proceed.');
                return;
            }
            localStorage.setItem('le_marodeur_table_number', tableNum);
            window.location.href = url;
        }

        document.addEventListener('DOMContentLoaded', updateTotals);
    </script>
    <script src="../js/data/dictionary.js"></script>
    <script src="../js/controller/LanguageController.js"></script>
</body>
</html>
