<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Restaurant App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- 
      Main Entry Point (Index) 
      Displays the welcome screen and allows the user to navigate to the menu. 
      Includes language selection and a call-service quick action.
    -->
    <div class="app-container welcome-screen">

        <header class="top-header" style="justify-content: flex-end; align-items: center; padding: 16px 24px;">
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="language-picker">
                    <select onchange="changeLanguage(this.value)" class="modern-select">
                        <option value="en">ENG</option>
                        <option value="sv">SWE</option>
                        <option value="fr">FRA</option>
                    </select>
                </div>
                <div class="service-action">
                    <a href="html/call-service.html" class="icon-btn bell-icon" aria-label="Notifications" style="display: flex; align-items: center; justify-content: center; position: relative;">
                        <svg class="bell-svg" viewBox="0 0 24 24" fill="none"
                            stroke="#b58c67" stroke-width="2.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            aria-hidden="true" style="width: 26px; height: 26px;">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span style="position: absolute; top: 0px; right: 2px; width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; border: 2px solid #1a3d3b;"></span>
                    </a>
                </div>
            </div>
        </header>

        <main class="welcome-content">                
            <h1 class="restaurant-name" data-i18n="restaurant_name">Five Pots and One Caulderon</h1>
            <p class="welcome-text" data-i18n="welcome_text">Scan, order, and enjoy right at your table.</p>
                
            <a href="html/menu.html" class="start-btn" data-i18n="view_menu">View Menu</a>
        </main>

    </div>
    <script src="js/data/dictionary.js"></script>
    <script src="js/data/menuData.js"></script>

    <script src="js/order_page.js"></script>
    <script src="js/controller/LanguageController.js"></script>
    <script src="js/controller/MenuController.js"></script>
</body>
</html>
